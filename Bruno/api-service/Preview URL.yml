info:
  name: Preview URL
  type: http
  seq: 11

http:
  method: GET
  url: "{{apiServiceUrl}}/documents/{{documentId}}/preview-url"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true

docs: |-
  URL présignée GET (60s) pour consulter le document dans le navigateur sans le télécharger à
  part. `previewMimeType` vaut "application/pdf" au lieu du `mimeType` d'origine quand le document
  est un DOCX/PPTX converti (voir `previewKey`) : c'est ce champ qu'il faut utiliser pour choisir
  le viewer, pas `mimeType`.

  Accessible au déposant, à tout modérateur/admin, ou à n'importe quel étudiant authentifié si le
  document est déjà `approved` (403 sinon).

  {{documentId}} rempli automatiquement par "Create Document" ou "Moderation Queue".
