info:
  name: Search Documents
  type: http
  seq: 12

http:
  method: GET
  url: "{{apiServiceUrl}}/search?q=td"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true

docs: |-
  Accessible à tout étudiant authentifié (pas réservé admin/modérateur, contrairement à
  /moderation). Documents `approved` uniquement, indexés dans Meilisearch à l'approbation (voir
  "Approve Document"). Filtres optionnels en query string : `promo` (promoId), `subject`,
  `fileType` (pdf|image|video|docx|pptx|markdown|other), `page`, `limit`.

  Chaque résultat porte un `thumbnailUrl` présigné (null tant que le thumbnail-worker n'a pas
  généré la miniature, ou pour un format non pris en charge).
