info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{authServiceUrl}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("token", res.body.token);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

docs: |-
  Identifiants WebAurion réels (voir variables `username`/`password` de l'environnement Local,
  jamais committées, voir Bruno/.gitignore). Remplit automatiquement `{{token}}` pour le reste
  de la collection.
