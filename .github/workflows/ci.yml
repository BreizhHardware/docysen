name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "12.4.2"

jobs:
  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/db
        run: pnpm run generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - run: pnpm nx run-many -t test --exclude=ocr-worker,tagging-worker,thumbnail-worker

  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ocr-worker, tagging-worker, thumbnail-worker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
        working-directory: apps/${{ matrix.service }}

      - run: pytest
        working-directory: apps/${{ matrix.service }}

  docker:
    needs: [test-node, test-python]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-service
          - auth-service
          - frontend
          - notif-service
          - ocr-worker
          - tagging-worker
          - thumbnail-worker
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tag
        id: vars
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=$(printf '%s' '${{ github.head_ref }}' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
