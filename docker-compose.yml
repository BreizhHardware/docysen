services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: docysen
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: dev-master-key

  garage:
    image: dxflrs/garage:v2.3.0
    ports:
      - "3900:3900" # S3 API, cible de S3_ENDPOINT en dev
      - "3903:3903" # Admin API
    volumes:
      - garage-meta:/data/meta
      - garage-data:/data/data
      - ./infra/garage.toml:/etc/garage.toml

  # Optionnel en dev : `nx dev thumbnail-worker` (venv local, voir apps/thumbnail-worker/README.md)
  # est plus rapide à itérer dessus que de reconstruire l'image à chaque changement de code.
  thumbnail-worker:
    build:
      context: .
      dockerfile: apps/thumbnail-worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://garage:3900
    depends_on:
      - redis
      - garage

volumes:
  postgres-data:
  garage-meta:
  garage-data:
