services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: docysen
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: dev-master-key

  garage:
    image: dxflrs/garage:v2.3.0
    ports:
      - "3900:3900" # S3 API, cible de S3_ENDPOINT en dev
      - "3903:3903" # Admin API
    volumes:
      - garage-meta:/data/meta
      - garage-data:/data/data
      - ./infra/garage.toml:/etc/garage.toml

  # Serveur SMTP de test : capture les emails sans les envoyer réellement.
  # Interface web : http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP (cible de SMTP_HOST/SMTP_PORT en dev)
      - "8025:8025" # Interface web

  # Optionnel en dev : `nx dev thumbnail-worker` (venv local, voir apps/thumbnail-worker/README.md)
  # est plus rapide à itérer dessus que de reconstruire l'image à chaque changement de code.
  thumbnail-worker:
    build:
      context: .
      dockerfile: apps/thumbnail-worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://garage:3900
    depends_on:
      - redis
      - garage

  # Optionnel en dev : `nx dev ocr-worker` (venv local, voir apps/ocr-worker/README.md) est plus
  # rapide à itérer dessus que de reconstruire l'image à chaque changement de code.
  ocr-worker:
    build:
      context: .
      dockerfile: apps/ocr-worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://garage:3900
    depends_on:
      - redis
      - garage

  # Optionnel en dev : `nx dev tagging-worker` (venv local, voir apps/tagging-worker/README.md)
  # Note : tagging-worker n'accède pas à S3, pas de dépendances système (pas de poppler/tesseract).
  tagging-worker:
    build:
      context: .
      dockerfile: apps/tagging-worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

volumes:
  postgres-data:
  garage-meta:
  garage-data:
