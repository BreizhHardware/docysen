services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docysen}
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-docysen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    volumes:
      - garage-meta:/data/meta
      - garage-data:/data/data
      - ./infra/garage.toml:/etc/garage.toml
    healthcheck:
      # Pas de shell garanti dans cette image (binaire Rust minimal) : forme exec, pas CMD-SHELL.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-docysen}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-service:
    build:
      context: .
      dockerfile: apps/api-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-docysen}
      S3_ENDPOINT: ${PUBLIC_ORIGIN}
      MEILISEARCH_URL: http://meilisearch:7700
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  notif-service:
    build:
      context: .
      dockerfile: apps/notif-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  thumbnail-worker:
    build:
      context: .
      dockerfile: apps/thumbnail-worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://garage:3900
    depends_on:
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy

  ocr-worker:
    build:
      context: .
      dockerfile: apps/ocr-worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://garage:3900
    depends_on:
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy

  tagging-worker:
    build:
      context: .
      dockerfile: apps/tagging-worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      # Utilisé par le Caddyfile ({$S3_BUCKET}) pour router les uploads/téléchargements
      # présignés vers Garage sans jamais réécrire le chemin (voir commentaire du Caddyfile).
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - api-service

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  meilisearch-data:
