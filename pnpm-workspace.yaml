packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  nx: true
  prisma: true

minimumReleaseAgeExclude:
  - "@vitejs/plugin-react@6.1.0"
  - vite@8.2.2

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - nx
  - prisma
